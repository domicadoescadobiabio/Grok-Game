<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Grok Game">
  <title>Grok Game</title>
  <!-- A speech bubble with a spade knocked out of it: the arcade is a card room
       you play by talking. The spade is a hole, not a shape, so the mark sits on
       any background and survives being shrunk to a favicon. -->
  <mask id="gg-spade">
    <rect width="64" height="64" fill="#fff"/>
    <path transform="translate(32 24.5) scale(0.355) translate(-50 -46)" fill="#000"
          d="M50 12C50 12 20 34 20 50c0 12 10 18 18 14 4-2 6-4 7-6l-3 22h16l-3-22c1 2 3 4 7 6 8 4 18-2 18-14 0-16-30-38-30-38Z"/>
  </mask>
  <g mask="url(#gg-spade)">
    <rect x="4" y="5" width="56" height="41" rx="13" fill="#d9b06a"/>
    <path d="M19 44 L15.5 59 L33 45.5 Z" fill="#d9b06a"/>
  </g>
</svg>
